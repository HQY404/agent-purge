<!doctype html>
<html lang="zh-CN">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>人设</title>
<link rel="stylesheet" href="style.css">
<script src="_magpie/bridge.js"></script>
<script src="personas.js"></script>
<script src="app.js" defer></script>

<h1>人设</h1>
<p class="lead">点一个就换。写进的是这个插件的 options，下一个经过 magpie 的请求就按它改 system 段。</p>

<section class="card">
	<div class="now">
		<span class="label">当前设置</span>
		<strong id="now-persona">—</strong>
		<span class="sep">/</span>
		<span id="now-mode">—</span>
	</div>
	<label class="field">
		<span>模式</span>
		<select id="mode"></select>
	</label>
	<p id="status" class="status" role="status" aria-live="polite" hidden></p>
</section>

<h2 id="count">全部人设</h2>
<input id="q" type="search" placeholder="搜索名字、id 或说明" aria-label="搜索人设" autocomplete="off">
<div id="list" class="list" role="group" aria-label="人设列表"></div>

</html>
